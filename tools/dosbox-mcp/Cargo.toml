[package]
name = "dosbox-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for dosbox-automation REST API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Niko1221/dosbox-automation"

[dependencies]
rmcp = { version = "0.2", features = ["transport-io"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
url = "2.5"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = { version = "0.14", features = ["toml"] }
dirs = "5.0"
base64 = "0.22"
urlencoding = "2.1"
which = "6.0"

[[bin]]
name = "dosbox-mcp"
path = "src/main.rs"