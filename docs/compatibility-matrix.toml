#
# Canonical data for the compatibility matrix. The markdown table is
# generated from this file; the website compatibility page reads it too.
# Results only: no game files are distributed and no download links are
# listed here. Every row carries the engine build the pass ran at.
#
# Tier ladder (derived from the verified checks, never hand-picked):
#   nothing  - media will not mount and will not boot
#   mounts   - media mounts and its contents are readable
#   boots    - reaches its title or attract screen
#   ingame   - accepts input, a session starts
#   playable - played for a meaningful stretch with graphics, sound
#              and input working (needs a real window and speakers)
# checks lists what was actually verified: mounts, reads, boots, vol.
# install: n/a (runs from its media), manual-needed (installer media,
# not installed in these passes), recipe (showroom install recipe).

intro = """# dosbox-automation Compatibility Matrix

Mount and boot verification of real-world media against the engine.
First-pass results are headless (offscreen video, no audio); the
playable tier requires a real window and is assessed separately.
Test media is not distributed and is not part of the repository.
"""

